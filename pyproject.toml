[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ficc-curve"
version = "0.1.0"
description = "中国国债收益率曲线量化交易与风险管理系统"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "INNOCUITY" }]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "pyarrow>=14",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "PyYAML>=6.0",
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.4,<2",
    "plotly>=5.18,<6",
    "matplotlib>=3.8,<4",
    "requests>=2.31",
    "openpyxl>=3.1",
    "tabulate>=0.9",  # pandas.to_markdown：研究结论报告的运行依赖
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "jupyterlab>=4.0",
]

[project.scripts]
ficc = "ficc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认跳过 network 测试：`make test` 必须离线可跑、确定性强。
# `-p no:debugging`：pytest 的 debugging 插件会 import pdb/readline，在部分环境
# （如本机 anaconda 的 readline 扩展）会导致段错误。禁用后不影响任何测试逻辑，
# 只是不提供 --pdb/--trace 交互调试；需要调试时用 `pytest --pdb -p debugging`。
addopts = ["-q", "--strict-markers", "-m", "not network", "-p", "no:debugging", "-p", "no:capture"]
markers = [
    "slow: 慢速测试（全样本回测、敏感性网格）",
    "network: 需要联网的测试",
]

[tool.ruff]
line-length = 100
# scripts/spike 是 Phase 0 一次性实测脚本，保持原貌以便回溯（不参与 lint/format）
extend-exclude = ["scripts/spike"]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# 注意：ruff 的 pandas 规则代码是 "PD"（且需 preview=true），不存在 "Pandas"。
# 早期写了 "Pandas" 会导致整个配置无法解析 —— 已修正。
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
    "E501",   # 行宽由 formatter 处理，不做硬性 lint 报错
    "RUF001", # 全角标点在中文注释/字符串里是正常现象
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
