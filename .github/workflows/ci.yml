name: Public evidence and contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: public-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:scripts
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public CPU dependencies
        run: |
          python -m pip install -e '.[dev,dashboard]'
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Lint source, tests, scripts and dashboard
        run: |
          ruff check src tests scripts apps
          ruff format --check src tests scripts apps
      - name: Verify archived report provenance and numeric consistency
        run: python scripts/build_report.py --check
      - name: Test public contracts and all dashboard pages
        run: python scripts/run_public_tests.py
      - name: Rebuild public reports and Python figures
        run: python scripts/build_report.py --output-root build/public-delivery
      - uses: actions/upload-artifact@v4
        with:
          name: public-delivery
          path: build/public-delivery/reports
